[project]
name = "finaudit-engine"
version = "0.1.0"
description = "Hybrid AI SaaS & Bank Statement Audit Engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
    "pytest>=8.0.0",
]

[project.scripts]
finaudit = "finaudit.cli:main"

[tool.pytest.ini_options]
pythonpath = ["."]

